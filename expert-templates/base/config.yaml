# Base Hermes profile config for __PROFILE__ / __EXPERT__.
# Model provider sections should be maintained by your existing Hermes template or WebUI setting page.

api_server:
  host: 0.0.0.0
  port: 8642

memory:
  provider: hindsight
  mode: local_external
  api_url: __HINDSIGHT_API_URL__
  bank_id: hermes-__PROFILE__

mcp_servers:
  obsidian_vault:
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "/data/hermes/obsidian-vault"
    enabled: true
    tools:
      resources: true
      prompts: false
  gbrain:
    command: "/usr/local/bin/gbrain"
    args: []
    enabled: true
    tools:
      resources: true
      prompts: false

auxiliary:
  curator:
    enabled: true
    interval_days: 7
    archive_unused_after_days: 45
    protect_bundled_skills: true
    protect_hub_skills: true

security:
  website_blocklist:
    enabled: true
    domains:
      - "169.254.169.254"

terminal:
  backend: docker
  docker_forward_env: []
  env_passthrough: []
