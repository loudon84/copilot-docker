[project]
name = "hermes-sqlbot-adapter"
version = "1.11.1"
description = "SQLBot MCP SSE adapter plugin for Hermes finance-bi toolset"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.26.0",
  "anyio==4.14.2",
  "httpx==0.28.1",
  "sqlglot>=26,<27",
  "cryptography>=43,<45",
  "PyYAML>=6.0,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["schemas"]
packages = ["sqlbot_adapter"]
