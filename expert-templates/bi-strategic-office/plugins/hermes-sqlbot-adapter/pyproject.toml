[project]
name = "hermes-sqlbot-adapter"
version = "1.11.0"
description = "SQLBot MCP adapter plugin for Hermes finance-bi toolset"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "sqlglot>=25.0,<28",
  "PyYAML>=6.0,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["schemas"]
packages = ["sqlbot_adapter"]
