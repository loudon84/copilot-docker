[project]
name = "hermes-sqlbot-adapter"
version = "1.12.0"
description = "SQLBot MCP SSE adapter plugin for Hermes finance-bi toolset"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.26.0",
  "anyio==4.14.2",
  "httpx==0.28.1",
  "sqlglot>=26,<27",
  "cryptography>=43,<45",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.entry-points."hermes_agent.plugins"]
hermes-sqlbot-adapter = "sqlbot_adapter.plugin:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sqlbot_adapter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
