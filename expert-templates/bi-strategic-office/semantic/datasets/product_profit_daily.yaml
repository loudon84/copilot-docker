  product_code:
    type: string
    description: 产品编码
  product_name:
    type: string
    description: 产品名称
  sales_region:
    type: string
    description: 销售区域
  customer_code:
    type: string
    description: 客户编码
  customer_name:
    type: string
    description: 客户名称
  report_currency:
    type: string
    description: 报告币种
  net_sales_amount:
    type: number
    description: 净销售额
  cogs_amount:
    type: number
    description: 销售成本
  gross_profit_amount:
    type: number
    description: 销售毛利
  etl_updated_at:
    type: timestamp
    description: ETL 更新时间
