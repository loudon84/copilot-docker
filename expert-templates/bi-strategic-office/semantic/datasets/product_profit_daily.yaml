id: product_profit_daily
name: 产品日销售利润
physical_table: bi_finance.product_profit_daily
grain: daily
primary_time_field: posting_date
entity_field: entity_code
currency_field: report_currency
available_dimensions:
  - product_code
  - product_name
  - sales_region
  - entity_code
  - report_currency
  - posting_date
  - customer_code
  - customer_name
available_metrics:
  - net_sales_amount
  - gross_profit_amount
  - gross_margin
  - cogs_amount
allowed_joins: []
