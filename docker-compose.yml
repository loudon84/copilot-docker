# Hermes WebUI + Agent + Hindsight + GBrain runtime.
# Usage:
#   bash scripts/build-image.sh                         # build once (shared by all instances)
#   bash scripts/create-instance.sh writer 9601 writer
#   bash scripts/up-instance.sh writer                  # reuses image, no rebuild

services:
  hermes-agent-webui:
    user: "1000:1000"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HERMES_WEBUI_REPO: ${HERMES_WEBUI_REPO:-http://git.superic.com/aiplatform/hermes-webui.git}
        HERMES_WEBUI_REF: ${HERMES_WEBUI_REF:-master}
        HERMES_AGENT_REPO: ${HERMES_AGENT_REPO:-http://git.superic.com/aiplatform/hermes-agent.git}
        HERMES_AGENT_REF: ${HERMES_AGENT_REF:-master}
        HERMES_VERSION: ${HERMES_VERSION:-git-build}
        INSTALL_GBRAIN: ${INSTALL_GBRAIN:-1}
        GBRAIN_REPO: ${GBRAIN_REPO:-http://git.superic.com/aiplatform/gbrain.git}
        GBRAIN_REF: ${GBRAIN_REF:-master}
        BUN_VERSION: ${BUN_VERSION:-bun-v1.2.15}
        INSTALL_FILESYSTEM_MCP: ${INSTALL_FILESYSTEM_MCP:-1}
        INSTALL_CLAWSEC: ${INSTALL_CLAWSEC:-0}
        CLAWSEC_REPO: ${CLAWSEC_REPO:-http://git.superic.com/aiplatform/clawsec.git}
        USE_CN_MIRRORS: ${USE_CN_MIRRORS:-1}
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.aliyun.com/debian}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: ${LOCAL_IMAGE_NAME:-hermes-agent-webui:latest}
    container_name: hermes-${HERMES_PROFILE:-default}
    restart: unless-stopped
    ports:
      - "${HERMES_WEBUI_BIND:-0.0.0.0}:${HERMES_WEBUI_PORT:-8787}:8787"
      # 可选，调试时开启 Gateway
      # - "${HERMES_GATEWAY_BIND:-127.0.0.1}:${HERMES_GATEWAY_PORT:-8642}:8642"
    environment:
      WANTED_UID: "1000"
      WANTED_GID: "1000"
      HERMES_PROFILE: ${HERMES_PROFILE:-default}
      HERMES_EXPERT: ${HERMES_EXPERT:-base}
      HERMES_HOME: /data/hermes
      HERMES_CONFIG_PATH: /data/hermes/config.yaml
      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: 8787
      HERMES_WEBUI_STATE_DIR: /data/hermes/webui
      HERMES_WEBUI_DEFAULT_WORKSPACE: /data/hermes/workspace
      HERMES_WEBUI_AGENT_DIR: /opt/hermes-agent
      HERMES_WEBUI_AUTO_INSTALL: 1
      HERMES_WEBUI_PASSWORD: ${HERMES_WEBUI_PASSWORD:?HERMES_WEBUI_PASSWORD is required}
      HERMES_SKIP_CHMOD: ${HERMES_SKIP_CHMOD:-0}

      # External memory provider: shared Hindsight service.
      HINDSIGHT_MODE: local_external
      HINDSIGHT_API_URL: ${HINDSIGHT_API_URL:-http://hindsight.superic.com:8888}
      HINDSIGHT_BANK_ID: ${HINDSIGHT_BANK_ID:-hermes-${HERMES_PROFILE:-default}}

      # Brain / vault / skills paths.
      GBRAIN_ENABLED: ${GBRAIN_ENABLED:-1}
      GBRAIN_HOME: /data/hermes/gbrain
      GBRAIN_VAULT: /data/hermes/obsidian-vault
      GBRAIN_COMMAND: ${GBRAIN_COMMAND:-/usr/local/bin/gbrain}
      HERMES_VAULT_PATH: /data/hermes/obsidian-vault
      HERMES_SKILLS_PATH: /data/hermes/skills
      HERMES_SKILL_INBOX_PATH: /data/hermes/skill-inbox
      HERMES_ATTACHMENTS_PATH: /data/hermes/webui/attachments
      HERMES_WORKSPACE_PATH: /data/hermes/workspace
      HERMES_TOOLS_PATH: /data/hermes/tools
      HERMES_PLUGINS_PATH: /data/hermes/plugins
      HERMES_CURATOR_ENABLED: ${HERMES_CURATOR_ENABLED:-1}
      HERMES_SELF_EVOLUTION_ENABLED: ${HERMES_SELF_EVOLUTION_ENABLED:-0}
      TZ: Asia/Shanghai
    volumes:
      - ./instances/${HERMES_PROFILE:-default}/data/hermes:/data/hermes
      - ./instances/${HERMES_PROFILE:-default}/data/hermes/tools:/home/hermeswebui/.hermes/tools
      - ./instances/${HERMES_PROFILE:-default}/data/hermes/plugins:/home/hermeswebui/.hermes/plugins
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
