schema_version: workcopilot.expert.v1
kind: expert
metadata:
  id: __EXPERT_ID__
  name: __EXPERT_NAME__
  version: 1.0.0
  description: __EXPERT_DESCRIPTION__
  category: general
  tags: []
  language: zh-CN
  owner: local
runtime:
  engine: hermes
  mode: team
  compatibility:
    hermes: ">=0.18.2"
    python: ">=3.11"
  entrypoints:
    soul: root/SOUL.md
    team: team.yaml
components:
  skills:
    - id: example-skill
      path: skills/example-skill
      required: true
  tools: []
  plugins: []
  policies: []
connector_slots: []
permissions:
  tools:
    default: deny
    allow: []
    deny:
      - terminal
  network:
    default: deny
    connector_slots: []
  data:
    maximum_classification: internal
    export_allowed: false
evaluations:
  suite: evaluations/cases.yaml
  minimum_score: 0.9
  required_gates:
    - schema
    - security
release:
  publishable: true
  approval:
    business: required
    security: required
provenance:
  source_repository: loudon84/copilot-docker
  derived_from: null
